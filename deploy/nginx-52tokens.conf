# 宝塔站点 52tokens.cc 的反代规则：粘贴到 网站 → 设置 → 配置文件 的 server { } 里
# （放在宝塔生成的 SSL、日志等配置之后，替换掉默认的 location / ）。
# 端口与 .env.prod 的 API_PORT / WEB_PORT / ADMIN_PORT 一致；容器端口只绑定 127.0.0.1。

# 后端的内部接口只给公开站容器经 Docker 内网调用，绝不对外（见 dev_docs/architecture/data-protection.md）
location ^~ /internal/ {
    return 404;
}

# 后台接口：后台 SPA 同域调用，鉴权和 CSRF 校验在后端
location ^~ /api/admin/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # 「立即检查」含 LLM 调用，可能要几十秒
}

# 后台 SPA（静态文件）；不带斜杠的 /admin 跳到 /admin/，否则会落到公开站显示 404
location = /admin {
    return 301 /admin/;
}
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:5174;
    proxy_set_header Host $host;
}

# 其余全部交给公开站（Astro SSR）
location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
