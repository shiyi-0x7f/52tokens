# 卡网比价的标准商品（归类目标）。aliases 是常见叫法，供人工核对归类时参考。
# status: hidden 的商品照样参与归类（准确识别出来，不混进别的商品），但不对外展示。
# 原则：涉及灰黑产的一律不展示（用户可以自己去店铺找，站点不主动罗列）：
#   - 接码 / 真人 KYC 验证：帮人绕过手机号、实名验证；
#   - 虚拟卡：常用于绕过支付风控；教育邮箱：常用于冒领学生优惠；
#   - 成品邮箱（Gmail / Outlook / iCloud / 其他）：批量注册小号的原料；
#   - Apple ID、推特、Telegram 账号与会员：非 AI 的社交平台账号，灰产关联深。
# 标题里的「接码」等敏感词对外展示时替换为中性说法，见 backend/app/domains/shops/sanitize.py。
# 导入：cd backend && uv run python -m app.cli.seed（按 slug upsert）

