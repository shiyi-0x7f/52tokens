# 官方订阅地区价采集配置：App、地区、各档位的匹配规则（唯一来源）。
#
# 采集器（backend/app/collectors/app_store.py）逐个抓取 App 在各地区 App Store 的公开页面，
# 读取「App 内购买项目」列表，按下面的规则把项目匹配到档位：
#   - include 里的词都出现、exclude 里的词都不出现（不区分大小写，括号/横线等视为空格）；
#   - 同名项目有多个价格（如月付和年付同名）时，取折合美元落在 price_band_usd 内的；
#     仍有多个时取最便宜的，价格相同则标为待核实、不写入。
# 同步时按本文件更新档位（新增 / 改名 / 删除），删除的档位连同其地区价一起删掉。
# 档位名称以 App Store 当前在卖的为准，改名或新增档位时同步修改这里。
#
# 注意：YAML 会把 NO / no 解析成 false，挪威的代码必须加引号。

apps:
  - slug: chatgpt
    name: ChatGPT
    provider: OpenAI
    app_store_id: "6448311069"
    app_store_slug: chatgpt
    plans:
      - { slug: go-monthly, name: ChatGPT Go, billing_period: monthly, sort_order: 1010,
          include: [ChatGPT Go], exclude: [Annual, Year, Credits, Plus, Pro], price_band_usd: [4, 15] }
      - { slug: plus-monthly, name: ChatGPT Plus, billing_period: monthly, sort_order: 1020,
          include: [ChatGPT Plus], exclude: [Annual, Year, Credits, Pro], price_band_usd: [8, 35] }
      - { slug: pro-100, name: ChatGPT Pro 100, billing_period: monthly, sort_order: 1030,
          include: [ChatGPT Pro 100], exclude: [Annual, Year, Credits], price_band_usd: [75, 140] }
      - { slug: pro-200, name: ChatGPT Pro 200, billing_period: monthly, sort_order: 1040,
          include: [ChatGPT Pro 200], exclude: [Annual, Year, Credits], price_band_usd: [150, 260] }
      - { slug: pro-500, name: ChatGPT Pro 500, billing_period: monthly, sort_order: 1050,
          include: [ChatGPT Pro 500], exclude: [Annual, Year, Credits], price_band_usd: [350, 700] }

  - slug: claude
    name: Claude
    provider: Anthropic
    app_store_id: "6473753684"
    app_store_slug: claude-by-anthropic
    plans:
      - { slug: pro-monthly, name: Claude Pro, billing_period: monthly, sort_order: 2010,
          include: [Claude Pro, Monthly], exclude: [Annual, Year, Max, Ultra], price_band_usd: [15, 35] }
      - { slug: max-monthly, name: Claude Max, billing_period: monthly, sort_order: 2020,
          include: [Claude Max, Monthly], exclude: [Annual, Year], price_band_usd: [90, 180] }
      - { slug: ultra-monthly, name: Claude Ultra, billing_period: monthly, sort_order: 2030,
          include: [Claude Ultra, Monthly], exclude: [Annual, Year], price_band_usd: [180, 350] }
      - { slug: pro-annual, name: Claude Pro Annual, billing_period: annual, sort_order: 2040,
          include: [Claude Pro, Annual], exclude: [Max, Ultra], price_band_usd: [160, 260] }

  - slug: gemini
    name: Gemini
    provider: Google
    app_store_id: "6477489729"
    app_store_slug: google-gemini
    plans:
      - { slug: ai-plus, name: Google AI Plus, billing_period: monthly, sort_order: 3010,
          include: [Google AI Plus], exclude: [Annual, Year, Pro, Ultra], price_band_usd: [3, 15] }
      - { slug: ai-pro, name: Google AI Pro, billing_period: monthly, sort_order: 3020,
          include: [Google AI Pro], exclude: [Annual, Year, Plus, Ultra], price_band_usd: [12, 35] }
      - { slug: ai-ultra, name: Google AI Ultra, billing_period: monthly, sort_order: 3030,
          include: [Google AI Ultra], exclude: [Annual, Year, Plus, Pro], price_band_usd: [150, 300] }

  - slug: grok
    name: Grok
    provider: xAI
    app_store_id: "6670324846"
    app_store_slug: grok
    plans:
      - { slug: supergrok-lite, name: SuperGrok Lite, billing_period: monthly, sort_order: 4010,
          include: [SuperGrok Lite], exclude: [Annual, Year, Plus, Heavy], price_band_usd: [5, 20] }
      - { slug: supergrok, name: SuperGrok, billing_period: monthly, sort_order: 4020,
          include: [SuperGrok], exclude: [Annual, Year, Lite, Plus, Heavy], price_band_usd: [20, 45] }
      - { slug: supergrok-plus, name: SuperGrok Plus, billing_period: monthly, sort_order: 4030,
          include: [SuperGrok Plus], exclude: [Annual, Year], price_band_usd: [70, 140] }
      - { slug: supergrok-heavy, name: SuperGrok Heavy, billing_period: monthly, sort_order: 4040,
          include: [SuperGrok Heavy], exclude: [Annual, Year, Lite], price_band_usd: [220, 400] }

