# 提交门禁（只检查，不改写文件）：
#   uv tool install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=no]

  # 用项目锁定的工具版本（uv.lock / pnpm-lock.yaml），不另行固定
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier --check
        entry: pnpm exec prettier --check
        language: system
        files: ^(frontend/|shared/|[^/]+\.(js|json|ya?ml)$)
        exclude: pnpm-lock\.yaml$
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        files: ^frontend/.*\.(ts|tsx|astro|js|mjs)$
