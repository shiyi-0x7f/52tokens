name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokens52
          POSTGRES_PASSWORD: tokens52
          POSTGRES_DB: tokens52_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokens52"
          --health-interval 30s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tokens52:tokens52@127.0.0.1:5432/tokens52_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          (cd backend && uv sync --locked)
          pnpm install --frozen-lockfile

      - name: Quality gate
        run: bash scripts/check.sh
