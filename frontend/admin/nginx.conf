# 后台 SPA 容器内的 nginx：只托管 /admin/ 下的静态文件；前端路由都回落到 index.html。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # 带哈希的静态资源可以长期缓存
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }
}
